# Example reverse-proxy hardening for a public CrackXNet deployment.
# Replace hostnames, certificate paths, upstreams, and logging paths before use.

server {
    listen 443 ssl http2;
    server_name pcb-inspection.example.com;

    ssl_certificate /etc/letsencrypt/live/pcb-inspection.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcb-inspection.example.com/privkey.pem;

    access_log /var/log/nginx/crackxnet-access.log;
    error_log /var/log/nginx/crackxnet-error.log warn;

    client_max_body_size 15m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name pcb-inspection.example.com;
    return 301 https://$host$request_uri;
}
